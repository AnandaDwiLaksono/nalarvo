[package]
name = "nalarvo-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "nalarvo-worker"
path = "src/bin/worker.rs"

[dependencies]
nalarvo-domain = { path = "../domain" }
nalarvo-contracts = { path = "../contracts" }
nalarvo-model-gateway = { path = "../model-gateway" }
nalarvo-application = { path = "../application" }
nalarvo-persistence = { path = "../persistence" }
base64 = "0.22"
sqlx = { workspace = true, features = ["sqlite"] }
chrono.workspace = true
futures-util.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "io-std", "process"] }
tokio-stream.workspace = true
tracing.workspace = true
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Security", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_SystemInformation"] }

[dev-dependencies]
tempfile = "3"
axum.workspace = true
