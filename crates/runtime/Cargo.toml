[package]
name = "nalarvo-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "nalarvo-worker"
path = "src/bin/worker.rs"

[dependencies]
nalarvo-domain = { path = "../domain" }
nalarvo-contracts = { path = "../contracts" }
nalarvo-model-gateway = { path = "../model-gateway" }
nalarvo-persistence = { path = "../persistence" }
sqlx = { workspace = true, features = ["sqlite"] }
chrono.workspace = true
futures-util.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "io-std", "process"] }
tokio-stream.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile = "3"
axum.workspace = true
